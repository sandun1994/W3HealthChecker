<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acme Cloud Services — High-Performance Cloud Architecture</title>
    <meta name="description" content="Discover enterprise-grade cloud hosting, automated scaling, and zero-trust security infrastructure engineered for mission-critical digital businesses.">
    <link rel="canonical" href="https://example.com/acme">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preload" href="/app.js" as="script">
    <!-- Open Graph -->
    <meta property="og:title" content="Acme Cloud Services">
    <meta property="og:description" content="Enterprise cloud hosting and infrastructure.">
    <meta property="og:url" content="https://example.com/acme">
    <meta property="og:image" content="https://example.com/og-image.jpg">
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Acme Cloud Services">
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Acme Cloud",
      "url": "https://example.com"
    }
    </script>
</head>
<body>
    <header>
        <h1>Next-Generation Enterprise Cloud Architecture</h1>
        <nav aria-label="Main Navigation">
            <a href="/features">Explore Features</a>
            <a href="/pricing">Pricing Plans</a>
        </nav>
    </header>
    <main>
        <h2>Reliable Distributed Computing</h2>
        <p>Deploy containers globally with sub-millisecond cold starts and automated geo-replication.</p>
        <img src="/cloud.jpg" alt="Global cloud datacenter topology diagram" width="800" height="400">
        
        <form action="/subscribe" method="POST">
            <label for="newsletter-email">Work Email</label>
            <input type="email" id="newsletter-email" name="email" required>
            <button type="submit" id="submit-btn">Subscribe to Updates</button>
        </form>

        <iframe src="https://example.com/status-widget" title="Live Cloud System Status"></iframe>
    </main>
    <script src="/app.js" defer></script>
</body>
</html>
